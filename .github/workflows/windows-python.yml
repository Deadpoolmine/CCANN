name: Windows Python package

on:
  push:
  pull_request:

jobs:
  windows-wheel:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build pytest pytest-timeout
      - run: python -m build --wheel
      - shell: pwsh
        run: python -m pip install (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
      - shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          python -c "import ccannpy, ccannpy._native; assert ccannpy._NativeIndex is ccannpy._native.Index; print(ccannpy._native.__file__)"
          python -m pytest -vv -s --timeout=120 "$env:GITHUB_WORKSPACE/tests/test_python_portable.py"
          python -m pytest -vv -s --timeout=120 "$env:GITHUB_WORKSPACE/tests/test_python_ssd.py::test_ssd_python_round_trip"
          Pop-Location
