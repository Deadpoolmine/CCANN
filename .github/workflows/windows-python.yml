name: Windows Python package

on:
  push:
  pull_request:

jobs:
  windows-wheel:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build pytest pytest-timeout
      - run: python -m build --wheel
      - shell: pwsh
        run: python -m pip install (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
      - shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          python -c "import ccannpy, ccannpy._native; assert ccannpy._NativeIndex is ccannpy._native.Index; print(ccannpy._native.__file__)"
          python -m pytest -vv --timeout=180 "$env:GITHUB_WORKSPACE/tests/test_python_portable.py" "$env:GITHUB_WORKSPACE/tests/test_python_ssd.py" -k "not graph_auto_merge_at_10000_deletes and not graph_all_deleted_at_threshold_can_accept_new_add and not graph_load_finishes_interrupted_auto_merge"
          Pop-Location

  windows-merge-stress:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build pytest pytest-timeout
      - run: python -m build --wheel
      - shell: pwsh
        run: python -m pip install (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
      - shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          python -u -m pytest -vv -s --timeout=600 "$env:GITHUB_WORKSPACE/tests/test_python_ssd.py" -k "graph_auto_merge_at_10000_deletes or graph_all_deleted_at_threshold_can_accept_new_add or graph_load_finishes_interrupted_auto_merge"
          Pop-Location
